# ~/.tmux.conf - stock sensible defaults
 # Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'sainnhe/tmux-fzf'

# continuum: auto-restore on tmux start
set -g @continuum-restore 'on'

# Unbind the mod key
unbind C-b

# Set the mod key to ctrl-a
set -g prefix C-a
bind C-a send-prefix

# Use 256 colors / true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# fzf
TMUX_FZF_LAUNCH_KEY="f"
bind s run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"


# Larger scrollback
set -g history-limit 50000

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g pane-border-lines single
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#a6e3a1"
set -g pane-border-indicators colour

# Mouse support
set -g mouse on

# Faster key repetition / no escape delay
set -sg escape-time 0

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and - (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style copy mode
set-window-option -g mode-keys vi
setw -g mode-keys vi

# Vim yank experience
# Enter copy mode with prefix + Escape (prefix + [ still works too)
bind Escape copy-mode

# v = begin selection, C-v = rectangle/block select, y = yank to system clipboard
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Y   send-keys -X copy-line-and-cancel  'wl-copy'

# Mouse drag selects and copies to the system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Paste the tmux buffer with prefix + p
bind p paste-buffer

# Easy pane navigation with Alt+arrows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=#a6e3a1,fg=#33452e"
set -g status-left-length 40
set -g status-right-length 60

# Left: session name in brackets (dark text on green)
set -g status-left "#[fg=#14320f,bold][#S]#[default] "

# Windows: inactive muted, active = bold near-black
setw -g window-status-separator "  "
setw -g window-status-format "#[fg=#4a6340]#I #W"
setw -g window-status-current-format "#[fg=black,bold]*#I #W#[default]"

# Right: empty (no clock / hostname)
set -g status-right ""

# States: activity / bell / messages / copy-mode
setw -g window-status-activity-style "fg=#8a5a00"
setw -g window-status-bell-style "fg=#7a1f1f,bold"
set -g message-style "bg=#14320f,fg=#a6e3a1"
set -g message-command-style "bg=#14320f,fg=#a6e3a1"
set -g mode-style "bg=#14320f,fg=#a6e3a1"

# pi coding agent
set -g extended-keys on

run '~/.tmux/plugins/tpm/tpm'
