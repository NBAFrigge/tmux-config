# ~/.tmux.conf - stock sensible defaults
 # Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'sainnhe/tmux-fzf'
# Ctrl+b F — open fzf session/window switcher

# continuum: auto-restore on tmux start
set -g @continuum-restore 'on'

# Unbind the mod key
unbind C-b

# Set the mod key to ctrl-a
set -g prefix C-a
bind C-a send-prefix

# Use 256 colors / true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# fzf
TMUX_FZF_LAUNCH_KEY="f"
bind s run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"


# Larger scrollback
set -g history-limit 50000

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Panes 
set -g pane-border-lines single
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"
set -g pane-border-indicators colour

# Mouse support
set -g mouse on

# Faster key repetition / no escape dela
set -sg escape-time 10

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and - (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style copy mode
set-window-option -g mode-keys vi
setw -g mode-keys vi

# --- Vim yank experience (Wayland: wl-copy) ---
# Enter copy mode with prefix + Escape (prefix + [ still works too)
bind Escape copy-mode

# v = begin selection, C-v = rectangle/block select, y = yank to system clipboard
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Y   send-keys -X copy-line-and-cancel  'wl-copy'

# Mouse drag selects and copies to the system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Paste the tmux buffer with prefix + p
bind p paste-buffer

# Easy pane navigation with Alt+arrows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Status bar — Tokyo Night + cyan/green accent ──────────────────────────
# Palette: bg #1a1b26 | surface #3b4261 | fg #c0caf5 | dim #565f89
#          blue #7aa2f7 | cyan #7dcfff | green #9ece6a | orange #ff9e64 | red #f7768e
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 60
set -g status-right-length 100

# Left: session name in a green block (nf session glyph), then a powerline arrow
set -g status-left "#[fg=#1a1b26,bg=#9ece6a,bold]  #S #[fg=#9ece6a,bg=#1a1b26,nobold]"

# Windows: inactive = dim, active = cyan powerline segment
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#1a1b26,bg=#1a1b26]#[fg=#565f89,bg=#1a1b26] #I #[fg=#414868]#[fg=#7a8bb9] #W "
setw -g window-status-current-format "#[fg=#7dcfff,bg=#1a1b26]#[fg=#1a1b26,bg=#7dcfff,bold] #I #[fg=#1a1b26,bg=#7dcfff]#[fg=#1a1b26,bg=#7dcfff] #W #[fg=#7dcfff,bg=#1a1b26,nobold]"

# Right: empty (no clock / hostname)
set -g status-right ""

# States: activity / bell / messages / copy-mode
setw -g window-status-activity-style "fg=#ff9e64,bg=#1a1b26"
setw -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#7dcfff,fg=#1a1b26"

# pi coding agent
set -g extended-keys on

run '~/.tmux/plugins/tpm/tpm'
